[workspace]
members = [
    "apps/api",
    "apps/indexer",
    "apps/wallet",
    "sdk/chains/base",
    "sdk/chains/bitcoin",
    "sdk/chains/ethereum",
    "sdk/deposits",
    "sdk/indexing",
    "sdk/indexing/http",
    "sdk/indexing/rocksdb",
    "sdk/wallets",
    "packages/storage",
    "packages/crypto",
    "packages/storage/rocksdb",
    "packages/json-rpc",
    "packages/http",
    "packages/design-lint",
    "tests/system",
]
exclude = ["old", "reference"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
alloy-primitives = { version = "=1.2.1", default-features = false, features = ["std"] }
alloy-consensus = { version = "=1.0.22", features = ["k256"] }
alloy-eips = "=1.0.22"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
futures-executor = "0.3"
hex = "=0.4.3"
k256 = { version = "=0.13.4", features = ["ecdsa", "schnorr"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", default-features = false }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.18.1", features = ["v7"] }
zeroize = "=1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
