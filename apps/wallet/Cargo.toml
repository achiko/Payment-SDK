[package]
name = "wallet-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.8.4"
chain-bitcoin = { path = "../../sdk/chains/bitcoin" }
chain-contract = { path = "../../sdk/chains/contract" }
chain-identity = { path = "../../sdk/chains/identity" }
chain-ethereum = { path = "../../sdk/chains/ethereum" }
clap = { version = "=4.5.50", features = ["derive", "env"] }
hex.workspace = true
http-support = { package = "http", path = "../../packages/http" }
indexing = { path = "../../sdk/indexing" }
json-rpc = { path = "../../packages/json-rpc" }
reqwest.workspace = true
serde = { version = "=1.0.219", features = ["derive"] }
serde_json.workspace = true
signer = { path = "../../sdk/signing/contract" }
signer-remote = { path = "../../sdk/signing/remote" }
telemetry = { path = "../../packages/telemetry" }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
uuid.workspace = true

[dev-dependencies]
alloy-primitives.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
futures-executor.workspace = true
signer-local = { path = "../../sdk/signing/local" }
tower = { version = "=0.5.2", features = ["util"] }
zeroize.workspace = true

[lints]
workspace = true
