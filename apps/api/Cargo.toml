[package]
name = "payment-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.8.4"
base = { path = "../../sdk/chains/base" }
chain-bitcoin = { path = "../../sdk/chains/bitcoin" }
chain-ethereum = { path = "../../sdk/chains/ethereum" }
deposits = { path = "../../sdk/deposits" }
indexing = { path = "../../sdk/indexing" }
indexing-http = { path = "../../sdk/indexing/http" }
json-rpc = { path = "../../packages/json-rpc" }
wallets = { path = "../../sdk/wallets" }
hex.workspace = true
http-kit = { package = "http", path = "../../packages/http" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
storage = { path = "../../packages/storage" }
storage-rocksdb = { path = "../../packages/storage/rocksdb" }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
reqwest.workspace = true
tempfile = "=3.27.0"

[lints]
workspace = true
