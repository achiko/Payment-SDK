[package]
name = "payment-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.8.4"
chain-bitcoin = { path = "../../sdk/chains/bitcoin" }
chain-ethereum = { path = "../../sdk/chains/ethereum" }
chain-identity = { path = "../../sdk/chains/identity" }
clap = { version = "=4.5.50", features = ["derive", "env"] }
deposits = { path = "../../sdk/deposits" }
hex.workspace = true
http-support = { package = "http", path = "../../packages/http" }
indexing = { path = "../../sdk/indexing" }
reqwest.workspace = true
serde = { version = "=1.0.219", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
signer = { path = "../../sdk/signing/contract" }
storage = { path = "../../sdk/storage" }
storage-rocksdb = { path = "../../sdk/storage/rocksdb" }
telemetry = { path = "../../packages/telemetry" }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
uuid.workspace = true

[dev-dependencies]
bitcoin.workspace = true
tempfile = "=3.27.0"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
