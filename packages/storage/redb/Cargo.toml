[package]
name = "storage-redb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bincode = { version = "=2.0.1", default-features = false, features = ["derive", "std"] }
redb = { version = "=4.2.0", default-features = false, features = ["std"] }
storage = { path = ".." }
tokio = { version = "=1.49.0", features = ["sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
