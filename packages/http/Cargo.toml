[package]
name = "http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Axum 0.8.5+ requires serde_core 1.0.221, which cannot coexist with the
# workspace's Rust-1.85-compatible serde 1.0.219 pin.
axum = "=0.8.4"
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
transport = { path = "../transport" }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
