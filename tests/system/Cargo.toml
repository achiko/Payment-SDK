[package]
name = "system-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
live-bitcoin-core = []

[dev-dependencies]
alloy-primitives.workspace = true
axum = "=0.8.4"
base = { path = "../../sdk/chains/base" }
base64 = "=0.22.1"
bitcoin.workspace = true
chain-bitcoin = { path = "../../sdk/chains/bitcoin" }
chain-ethereum = { path = "../../sdk/chains/ethereum" }
deposits = { path = "../../sdk/deposits" }
hex.workspace = true
http = { path = "../../packages/http" }
indexer-worker = { path = "../../apps/indexer" }
indexing = { path = "../../sdk/indexing" }
indexing-http = { path = "../../sdk/indexing/http" }
json-rpc = { path = "../../packages/json-rpc" }
payment-api = { path = "../../apps/api" }
reqwest.workspace = true
serde_json.workspace = true
storage-rocksdb = { path = "../../packages/storage/rocksdb" }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
wallets = { path = "../../sdk/wallets" }

[[test]]
name = "bitcoin_core"
path = "tests/bitcoin_core.rs"
required-features = ["live-bitcoin-core"]

[lints]
workspace = true
