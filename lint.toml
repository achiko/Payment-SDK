[dependency]
ignored_packages = ["design-lint"]

[[dependency.layers]]
name = "package"
directory = "packages"
may_depend_on = ["package"]

[[dependency.layers]]
name = "base"
may_depend_on = ["package"]

[[dependency.layers]]
name = "indexing"
may_depend_on = ["package", "base"]

[[dependency.layers]]
name = "wallets"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "indexing-adapter"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "indexing-runtime"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "bitcoin-chain"
may_depend_on = ["package", "base", "indexing", "wallets"]

[[dependency.layers]]
name = "ethereum-chain"
may_depend_on = ["package", "base", "indexing", "wallets"]

[[dependency.layers]]
name = "sdk-unclassified"
directory = "sdk"
may_depend_on = []

[[dependency.layers]]
name = "application"
directory = "apps"
may_depend_on = ["package", "base", "indexing", "wallets", "indexing-adapter", "indexing-runtime", "bitcoin-chain", "ethereum-chain"]

[[dependency.layers]]
name = "acceptance"
directory = "tests"
may_depend_on = ["package", "base", "indexing", "wallets", "indexing-adapter", "indexing-runtime", "bitcoin-chain", "ethereum-chain", "application"]

[[dependency.package_layers]]
package = "base"
layer = "base"

[[dependency.package_layers]]
package = "indexing"
layer = "indexing"

[[dependency.package_layers]]
package = "wallets"
layer = "wallets"

[[dependency.package_layers]]
package = "indexing-postgres"
layer = "indexing-adapter"

[[dependency.package_layers]]
package = "indexing-redb"
layer = "indexing-adapter"

[[dependency.package_layers]]
package = "indexing-runtime"
layer = "indexing-runtime"

[[dependency.package_layers]]
package = "chain-bitcoin"
layer = "bitcoin-chain"

[[dependency.package_layers]]
package = "chain-ethereum"
layer = "ethereum-chain"

[vocabulary]
[[vocabulary.owners]]
words = ["bitcoin", "btc"]
allowed_paths = ["apps/", "sdk/chains/bitcoin/"]

[[vocabulary.owners]]
words = ["ethereum", "eth"]
allowed_paths = ["apps/", "sdk/chains/ethereum/"]

[repository]
maximum_rust_lines = 500
forbidden_paths = ["apps/indexer", "apps/wallet", "sdk/deposits", "sdk/indexing/http"]
chain_root = "sdk/chains"
chain_exclusions = ["base"]
chain_skeleton = [
    "src/lib.rs",
    "src/address.rs",
    "src/batch.rs",
    "src/error.rs",
    "src/indexer/mod.rs",
    "src/indexer/source/mod.rs",
    "src/rpc/mod.rs",
    "src/transaction/mod.rs",
    "src/transaction/operations/mod.rs",
    "src/wallet/mod.rs",
]
chain_directories = [
    "src/indexer",
    "src/indexer/source",
    "src/rpc",
    "src/transaction",
    "src/transaction/operations",
    "src/wallet",
]

[source]
ignored_directories = [".git", "target", "vendor", "generated", "old", "reference", "lint"]
self_packages = ["design-lint"]
