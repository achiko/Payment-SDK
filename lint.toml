[dependency]
ignored_packages = ["design-lint"]

[[dependency.layers]]
name = "package"
directory = "packages"
may_depend_on = ["package"]

[[dependency.layers]]
name = "base"
may_depend_on = ["package"]

[[dependency.layers]]
name = "indexing"
may_depend_on = ["package", "base"]

[[dependency.layers]]
name = "wallets"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "deposits"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "indexing-adapter"
may_depend_on = ["package", "base", "indexing"]

[[dependency.layers]]
name = "bitcoin-chain"
may_depend_on = ["package", "base", "indexing", "wallets"]

[[dependency.layers]]
name = "ethereum-chain"
may_depend_on = ["package", "base", "indexing", "wallets"]

[[dependency.layers]]
name = "sdk-unclassified"
directory = "sdk"
may_depend_on = []

[[dependency.layers]]
name = "application"
directory = "apps"
may_depend_on = ["package", "base", "indexing", "wallets", "deposits", "indexing-adapter", "bitcoin-chain", "ethereum-chain"]

[[dependency.layers]]
name = "acceptance"
directory = "tests"
may_depend_on = ["package", "base", "indexing", "wallets", "deposits", "indexing-adapter", "bitcoin-chain", "ethereum-chain", "application"]

[[dependency.package_layers]]
package = "base"
layer = "base"

[[dependency.package_layers]]
package = "indexing"
layer = "indexing"

[[dependency.package_layers]]
package = "wallets"
layer = "wallets"

[[dependency.package_layers]]
package = "deposits"
layer = "deposits"

[[dependency.package_layers]]
package = "indexing-http"
layer = "indexing-adapter"

[[dependency.package_layers]]
package = "indexing-rocksdb"
layer = "indexing-adapter"

[[dependency.package_layers]]
package = "chain-bitcoin"
layer = "bitcoin-chain"

[[dependency.package_layers]]
package = "chain-ethereum"
layer = "ethereum-chain"

[environment_boundary]
[[environment_boundary.allow]]
path_contains = "/apps/"

[command_boundary]
[[command_boundary.allow]]
path_contains = "/apps/"

[vocabulary]
forbidden = ["bitcoin", "btc", "ethereum", "eth"]
allowed_paths = ["apps/", "sdk/chains/bitcoin/", "sdk/chains/ethereum/", "tests/system/"]

[source]
ignored_directories = [".git", "target", "vendor", "old", "reference", "lint"]
self_packages = ["design-lint"]
